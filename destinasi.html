            { id: 34, provinsi: "papua-selatan", lokasi: "Merauke", label: "Alam", warnaLabel: "bg-green-500", judul: "Danau Rawa Biru", gambar: "https://images.unsplash.com/photo-1437482078695-73f5ca6c96e2?auto=format&fit=crop&w=800&q=80", deskripsi: "Sumber mata air utama kota Merauke. Di kelilingi hamparan bunga teratai dan menjadi habitat burung-burung migran dari Australia." },
            { id: 35, provinsi: "papua-selatan", lokasi: "Agats, Asmat", label: "Budaya", warnaLabel: "bg-red-500", judul: "Desa Agats (Asmat)", gambar: "https://images.unsplash.com/photo-1590523277543-a94d2e4eb00b?auto=format&fit=crop&w=800&q=80", deskripsi: "Kota panggung di atas lumpur. Dikenal dengan seniman ukir kayunya yang mahakaryanya telah diakui oleh UNESCO." },
            { id: 36, provinsi: "papua-selatan", lokasi: "Merauke", label: "Pantai", warnaLabel: "bg-cyan-500", judul: "Pantai Payum", gambar: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80", deskripsi: "Pantai lumpur yang sangat luas. Di sini, wisatawan sering diajak berburu kerang (bia) bersama warga lokal saat air laut sedang surut." }
        ];

        const gridContainer = document.getElementById('grid-container');
        const searchInput = document.getElementById('searchInput');
        let currentFilter = 'all';

        // Render Kartu & Integrasi Modal
        function renderKartu(data) {
            gridContainer.innerHTML = ''; 
            if(data.length === 0) {
                gridContainer.innerHTML = '<div class="col-span-full py-16 text-center fade-in"><i class="fas fa-search-location text-5xl text-gray-300 mb-4"></i><p class="text-gray-500 font-bold text-lg">Destinasi tidak ditemukan. Coba kata kunci lain.</p></div>';
                return;
            }

            data.forEach(item => {
                const cardHTML = `
                    <div class="bg-white rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden fade-in flex flex-col border border-gray-100 transform hover:-translate-y-1">
                        <div class="h-56 overflow-hidden bg-gray-200 relative group cursor-pointer" onclick="bukaModal(${item.id})">
                            <img src="${item.gambar}" alt="${item.judul}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                            <span class="absolute top-4 right-4 ${item.warnaLabel} text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wider text-white shadow-sm">${item.label}</span>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="mb-2 flex items-center text-xs font-bold text-green-700 bg-green-50 w-max px-3 py-1 rounded-md">
                                <i class="fas fa-map-marker-alt mr-2 text-green-600"></i> ${item.lokasi}
                            </div>
                            <h4 class="font-extrabold text-2xl mb-3 text-gray-900 line-clamp-1">${item.judul}</h4>
                            <p class="text-gray-600 text-sm mb-5 line-clamp-2 leading-relaxed">${item.deskripsi}</p>
                            <button onclick="bukaModal(${item.id})" class="inline-flex items-center text-gray-900 font-bold text-sm hover:text-green-700 transition-colors mt-auto text-left">
                                Selengkapnya <i class="fas fa-arrow-right ml-2 text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                gridContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Logika Filter & Search
        function saringData() {
            const searchTerm = searchInput.value.toLowerCase();
            const dataDisaring = dataDestinasi.filter(item => {
                const matchProvinsi = currentFilter === 'all' || item.provinsi === currentFilter;
                const matchSearch = item.judul.toLowerCase().includes(searchTerm) || item.lokasi.toLowerCase().includes(searchTerm);
                return matchProvinsi && matchSearch;
            });
            renderKartu(dataDisaring);
        }

        // Event Listeners Filter Tombol
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-green-700', 'text-white', 'shadow-md');
                    b.classList.add('bg-white', 'text-gray-700', 'shadow-sm');
                });
                btn.classList.remove('bg-white', 'text-gray-700', 'shadow-sm');
                btn.classList.add('bg-green-700', 'text-white', 'shadow-md');
                
                currentFilter = btn.getAttribute('data-filter');
                saringData();
            });
        });

        // Event Listener Search Input
        searchInput.addEventListener('input', saringData);

        // Inisialisasi awal
        renderKartu(dataDestinasi);

        // LOGIKA MODAL POP-UP & WHATSAPP
        const modal = document.getElementById('modalDetail');
        function bukaModal(id) {
            const item = dataDestinasi.find(d => d.id === id);
            document.getElementById('modalImg').src = item.gambar;
            document.getElementById('modalLabel').textContent = item.label;
            document.getElementById('modalLabel').className = `text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-wider text-white mb-4 inline-block ${item.warnaLabel}`;
            document.getElementById('modalTitle').textContent = item.judul;
            document.getElementById('modalLokasi').textContent = item.lokasi;
            document.getElementById('modalDesc').textContent = item.deskripsi;
            
            // Format Pesan WhatsApp Dinamis
            const noWaAdmin = "6281234567890"; // Ganti dengan nomor WA Anda
            const pesanWa = `Halo Admin Papuaguide, saya tertarik untuk memesan paket wisata ke ${item.judul} (${item.lokasi}). Bisa minta informasi lebih lanjut?`;
            document.getElementById('modalWaBtn').href = `https://wa.me/${noWaAdmin}?text=${encodeURIComponent(pesanWa)}`;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden'; 
        }

        function tutupModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto'; 
        }

        // Tutup modal jika klik area luar modal
        modal.addEventListener('click', function(e) {
            if (e.target === modal) tutupModal();
        });

        // LOGIKA BACK TO TOP BUTTON
        const btnBackTop = document.getElementById('btnBackTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                btnBackTop.classList.remove('scale-0', 'opacity-0');
                btnBackTop.classList.add('scale-100', 'opacity-100');
            } else {
                btnBackTop.classList.remove('scale-100', 'opacity-100');
                btnBackTop.classList.add('scale-0', 'opacity-0');
            }
        });
    </script>
</body>
</html>

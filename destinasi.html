<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Destinasi | Papuaguide-id</title>
    
    <meta name="description" content="Katalog destinasi wisata alam, bahari, pegunungan, dan budaya terbaik di Papua. Temukan petualangan Anda berikutnya.">
    <meta name="keywords" content="destinasi papua, objek wisata papua, raja ampat, carstensz, macarthur, sentani">
    <meta name="author" content="Papuaguide-id">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Katalog Destinasi Papua | Papuaguide-id">
    <meta property="og:description" content="Jelajahi keindahan alam rahasia dan budaya luhur masyarakat Papua di sini.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1516690561799-46d8f74f9abf?auto=format&fit=crop&w=1200&q=80">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pt-20">

    <nav class="bg-white shadow-md fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="text-3xl font-black text-green-800 tracking-tighter">Papua<span class="text-yellow-500">guide</span><span class="text-gray-800 font-bold">-id</span></a>
                </div>
                
                <div class="hidden lg:flex space-x-8 items-center">
                    <a href="index.html" class="text-gray-700 hover:text-green-700 font-semibold transition">Beranda</a>
                    <a href="destinasi.html" class="text-green-700 font-bold border-b-2 border-green-700 pb-1">Destinasi</a>
                    <a href="index.html#artikel" class="text-gray-700 hover:text-green-700 font-semibold transition">Artikel</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="py-16 min-h-[70vh]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-12">
                <h1 class="text-4xl font-extrabold text-gray-900 mb-4">Eksplorasi Seluruh Destinasi</h1>
                <p class="text-gray-600 max-w-2xl mx-auto mb-8">Temukan keajaiban alam dan budaya yang tersebar di seluruh pelosok Tanah Papua.</p>
                <div class="w-24 h-1 bg-yellow-500 mx-auto rounded mb-10"></div>
                
                <div class="flex flex-wrap justify-center gap-4 mb-12">
                    <button class="filter-btn bg-green-700 text-white px-6 py-2.5 rounded-full font-bold shadow-md transition" data-filter="all">Semua Destinasi</button>
                    <button class="filter-btn bg-white text-gray-700 border border-gray-300 px-6 py-2.5 rounded-full font-bold hover:bg-green-50 shadow-sm transition" data-filter="alam">Alam & Bahari</button>
                    <button class="filter-btn bg-white text-gray-700 border border-gray-300 px-6 py-2.5 rounded-full font-bold hover:bg-green-50 shadow-sm transition" data-filter="budaya">Budaya & Sejarah</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-10" id="grid-container"></div>
        </div>
    </section>

    <footer class="bg-gray-950 text-gray-400 pt-10 pb-8 border-t-4 border-yellow-500 mt-10">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            <h2 class="text-2xl font-black text-white tracking-tighter mb-4">Papua<span class="text-yellow-500">guide</span>-id</h2>
            <p>&copy; 2026 Papuaguide-id. Didesain dengan <i class="fas fa-heart text-red-500 mx-1"></i> di Indonesia.</p>
        </div>
    </footer>

    <script>
        // Data destinasi menggunakan ID spesifik Unsplash agar kebal pemblokiran browser lokal
        const dataDestinasi = [
            {
                id: 1,
                kategori: "alam",
                label: "Bahari",
                warnaLabel: "bg-yellow-400 text-gray-900",
                judul: "Kepulauan Raja Ampat",
                gambar: "https://images.unsplash.com/photo-1516690561799-46d8f74f9abf?auto=format&fit=crop&w=800&q=80",
                deskripsi: "Kepingan surga yang jatuh ke bumi. Spot diving kelas dunia dengan terumbu karang yang memukau."
            },
            {
                id: 2,
                kategori: "budaya",
                label: "Budaya",
                warnaLabel: "bg-red-500 text-white",
                judul: "Lembah Baliem",
                gambar: "https://images.unsplash.com/photo-1590523277543-a94d2e4eb00b?auto=format&fit=crop&w=800&q=80",
                deskripsi: "Saksikan tradisi luhur masyarakat pegunungan Jayawijaya yang eksotis dalam balutan festival tertua."
            },
            {
                id: 3,
                kategori: "alam",
                label: "Alam",
                warnaLabel: "bg-green-500 text-white",
                judul: "Danau Sentani",
                gambar: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=800&q=80",
                deskripsi: "Danau terluas di Papua yang dihiasi oleh pulau-pulau kecil. Sangat indah dinikmati saat matahari terbenam."
            },
            {
                id: 4,
                kategori: "alam",
                label: "Pegunungan",
                warnaLabel: "bg-teal-600 text-white",
                judul: "Puncak Jayawijaya",
                gambar: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80",
                deskripsi: "Satu-satunya kawasan pegunungan tinggi di Indonesia di mana Anda bisa menemukan fenomena salju abadi."
            },
            {
                id: 5,
                kategori: "budaya",
                label: "Sejarah",
                warnaLabel: "bg-amber-700 text-white",
                judul: "Tugu MacArthur",
                gambar: "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=800&q=80",
                deskripsi: "Situs saksi bisu sejarah Perang Dunia II di Jayapura yang menawarkan lanskap panorama alam yang memikat."
            }
        ];

        const gridContainer = document.getElementById('grid-container');

        function renderKartu(data) {
            gridContainer.innerHTML = ''; 
            if(data.length === 0) {
                gridContainer.innerHTML = '<p class="text-gray-500 col-span-3 text-center py-10 font-bold">Belum ada destinasi di kategori ini.</p>';
                return;
            }

            data.forEach(item => {
                const cardHTML = `
                    <div class="destinasi-item bg-white rounded-2xl shadow-md hover:shadow-xl transition-shadow duration-300 overflow-hidden fade-in">
                        <div class="h-48 overflow-hidden bg-gray-200 relative group">
                            <img src="${item.gambar}" alt="${item.judul}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                            <span class="absolute top-4 right-4 ${item.warnaLabel} text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-sm">${item.label}</span>
                        </div>
                        <div class="p-6 flex flex-col h-[200px] justify-between">
                            <div>
                                <h4 class="font-extrabold text-xl mb-2 text-gray-900 line-clamp-1">${item.judul}</h4>
                                <p class="text-gray-600 text-sm mb-4 line-clamp-3">${item.deskripsi}</p>
                            </div>
                            <a href="#" class="inline-flex items-center text-green-700 font-bold text-sm hover:text-green-800 hover:underline mt-auto">
                                Baca Selengkapnya <i class="fas fa-arrow-right ml-2 text-xs"></i>
                            </a>
                        </div>
                    </div>
                `;
                gridContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        renderKartu(dataDestinasi);

        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-green-700', 'text-white', 'shadow-md');
                    b.classList.add('bg-white', 'text-gray-700', 'shadow-sm');
                });
                
                btn.classList.remove('bg-white', 'text-gray-700', 'shadow-sm');
                btn.classList.add('bg-green-700', 'text-white', 'shadow-md');

                const filterValue = btn.getAttribute('data-filter');
                const dataDisaring = filterValue === 'all' ? dataDestinasi : dataDestinasi.filter(item => item.kategori === filterValue);
                renderKartu(dataDisaring);
            });
        });
    </script>
</body>
</html>

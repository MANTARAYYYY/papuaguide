<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Destinasi | Papuaguide-id</title>
    
    <meta name="description" content="Katalog destinasi wisata alam, bahari, pegunungan, dan budaya terbaik di Papua. Temukan petualangan Anda berikutnya.">
    <meta name="keywords" content="destinasi papua, objek wisata papua, raja ampat, carstensz, macarthur, sentani, teluk cenderawasih, danau paniai">
    <meta name="author" content="Papuaguide-id">
    <meta name="robots" content="index, follow">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        /* Transisi untuk Modal */
        .modal-enter { animation: modalFadeIn 0.3s ease-out forwards; }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pt-20">

    <nav class="bg-white shadow-md fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="text-3xl font-black text-green-800 tracking-tighter">Papua<span class="text-yellow-500">guide</span><span class="text-gray-800 font-bold">-id</span></a>
                </div>
                
                <div class="hidden lg:flex space-x-8 items-center">
                    <a href="index.html" class="text-gray-700 hover:text-green-700 font-semibold transition">Beranda</a>
                    <a href="destinasi.html" class="text-green-700 font-bold border-b-2 border-green-700 pb-1">Destinasi</a>
                    <a href="index.html#artikel" class="text-gray-700 hover:text-green-700 font-semibold transition">Artikel</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="py-16 min-h-[80vh]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-10">
                <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-4">Eksplorasi Keajaiban Papua</h1>
                <p class="text-gray-600 max-w-2xl mx-auto mb-8 text-lg">Dari Kepulauan Raja Ampat hingga padang savana Merauke, temukan 15 destinasi terbaik di 6 Provinsi Tanah Papua.</p>
                <div class="w-24 h-1 bg-yellow-500 mx-auto rounded mb-8"></div>
                
                <div class="max-w-xl mx-auto mb-8 relative">
                    <input type="text" id="searchInput" class="w-full px-6 py-4 pl-14 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600 shadow-sm text-gray-700 font-semibold" placeholder="Cari nama destinasi... (misal: Raja Ampat)">
                    <i class="fas fa-search absolute left-6 top-5 text-gray-400 text-lg"></i>
                </div>

                <div class="flex overflow-x-auto hide-scroll justify-start md:justify-center gap-3 mb-10 pb-2">
                    <button class="filter-btn flex-shrink-0 bg-green-700 text-white px-6 py-2.5 rounded-full font-bold shadow-md transition" data-filter="all">Semua Wilayah</button>
                    <button class="filter-btn flex-shrink-0 bg-white text-gray-700 border border-gray-300 px-5 py-2.5 rounded-full font-bold hover:bg-green-50 shadow-sm transition" data-filter="papua-barat-daya">Papua Barat Daya</button>
                    <button class="filter-btn flex-shrink-0 bg-white text-gray-700 border border-gray-300 px-5 py-2.5 rounded-full font-bold hover:bg-green-50 shadow-sm transition" data-filter="papua-barat">Papua Barat</button>
                    <button class="filter-btn flex-shrink-0 bg-white text-gray-700 border border-gray-300 px-5 py-2.5 rounded-full font-bold hover:bg-green-50 shadow-sm transition" data-filter="papua">Papua (Induk)</button>
                    <button class="filter-btn flex-shrink-0 bg-white text-gray-700 border border-gray-300 px-5 py-2.5 rounded-full font-bold hover:bg-green-50 shadow-sm transition" data-filter="papua-tengah">Papua Tengah</button>
                    <button class="filter-btn flex-shrink-0 bg-white text-gray-700 border border-gray-300 px-5 py-2.5 rounded-full font-bold hover:bg-green-50 shadow-sm transition" data-filter="papua-pegunungan">Papua Pegunungan</button>
                    <button class="filter-btn flex-shrink-0 bg-white text-gray-700 border border-gray-300 px-5 py-2.5 rounded-full font-bold hover:bg-green-50 shadow-sm transition" data-filter="papua-selatan">Papua Selatan</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="grid-container"></div>
        </div>
    </section>

    <div id="modalDetail" class="fixed inset-0 bg-gray-900/80 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative modal-enter hide-scroll">
            <button onclick="tutupModal()" class="absolute top-4 right-4 bg-black/50 hover:bg-black text-white rounded-full w-10 h-10 flex items-center justify-center transition z-10"><i class="fas fa-times text-xl"></i></button>
            <img id="modalImg" src="" alt="Gambar Destinasi" class="w-full h-72 object-cover">
            <div class="p-8">
                <span id="modalLabel" class="text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-wider text-white bg-green-600 mb-4 inline-block"></span>
                <h3 id="modalTitle" class="text-3xl font-extrabold text-gray-900 mb-3"></h3>
                <div class="mb-6 flex items-center text-sm font-bold text-green-700 bg-green-50 w-max px-4 py-2 rounded-lg">
                    <i class="fas fa-map-marker-alt mr-2 text-green-600"></i> <span id="modalLokasi"></span>
                </div>
                <h4 class="font-bold text-gray-900 mb-2">Tentang Destinasi:</h4>
                <p id="modalDesc" class="text-gray-600 leading-relaxed mb-8 text-lg"></p>
                <div class="flex gap-4">
                    <button onclick="tutupModal()" class="w-full bg-gray-100 text-gray-700 font-bold py-4 rounded-xl hover:bg-gray-200 transition">Kembali</button>
                    <a href="index.html#kontak" class="w-full text-center bg-green-700 text-white font-bold py-4 rounded-xl hover:bg-green-800 transition shadow-lg">Pesan Tur</a>
                </div>
            </div>
        </div>
    </div>

    <button id="btnBackTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-8 right-8 bg-yellow-500 text-gray-900 w-14 h-14 rounded-full shadow-2xl flex items-center justify-center hover:bg-yellow-400 transition-all transform scale-0 z-50 border-4 border-white cursor-pointer opacity-0">
        <i class="fas fa-arrow-up text-xl"></i>
    </button>

    <footer class="bg-gray-950 text-gray-400 pt-10 pb-8 border-t-4 border-yellow-500">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            <h2 class="text-2xl font-black text-white tracking-tighter mb-4">Papua<span class="text-yellow-500">guide</span>-id</h2>
            <p>&copy; 2026 Papuaguide-id. Didesain dengan <i class="fas fa-heart text-red-500 mx-1"></i> di Indonesia.</p>
        </div>
    </footer>

    <script>
        const dataDestinasi = [
            { id: 1, provinsi: "papua-barat-daya", lokasi: "Papua Barat Daya", label: "Bahari", warnaLabel: "bg-blue-500 text-white", judul: "Kepulauan Raja Ampat", gambar: "https://images.unsplash.com/photo-1516690561799-46d8f74f9abf?auto=format&fit=crop&w=800&q=80", deskripsi: "Kepingan surga yang jatuh ke bumi. Spot diving kelas dunia dengan terumbu karang yang memukau dan keanekaragaman hayati laut tertinggi. Anda bisa menyewa kapal phinisi untuk berkeliling kepulauan." },
            { id: 2, provinsi: "papua-barat-daya", lokasi: "Papua Barat Daya", label: "Ikonik", warnaLabel: "bg-yellow-400 text-gray-900", judul: "Gugusan Karang Piaynemo", gambar: "https://images.unsplash.com/photo-1580556272304-45e0fb1eb246?auto=format&fit=crop&w=800&q=80", deskripsi: "Ikon pariwisata Raja Ampat. Mendaki ratusan anak tangga kayu akan terbayar lunas dengan pemandangan gugusan pulau karang berbentuk bintang dari atas bukit." },
            { id: 3, provinsi: "papua-barat-daya", lokasi: "Papua Barat Daya", label: "Budaya", warnaLabel: "bg-red-500 text-white", judul: "Desa Wisata Sauwandarek", gambar: "https://images.unsplash.com/photo-1528164344705-47542687000d?auto=format&fit=crop&w=800&q=80", deskripsi: "Desa tradisional yang terkenal dengan keramahan penduduk aslinya, serta kerajinan anyaman daun pandan (Noken) yang khas. Pengunjung juga bisa berinteraksi langsung dengan warga lokal." },
            { id: 4, provinsi: "papua-barat", lokasi: "Kaimana, Papua Barat", label: "Bahari", warnaLabel: "bg-blue-500 text-white", judul: "Teluk Triton", gambar: "https://images.unsplash.com/photo-1518349619113-03114f06ac3a?auto=format&fit=crop&w=800&q=80", deskripsi: "Dikenal sebagai 'The Fish Empire'. Menyajikan tebing karst raksasa yang menjulang dari laut, lukisan purba di dinding tebing, dan pemandangan senja terbaik di Kaimana." },
            { id: 5, provinsi: "papua-barat", lokasi: "Peg. Arfak, Papua Barat", label: "Alam", warnaLabel: "bg-green-500 text-white", judul: "Danau Anggi", gambar: "https://images.unsplash.com/photo-1439853949703-ff2200f56f0a?auto=format&fit=crop&w=800&q=80", deskripsi: "Dua danau kembar (Giji dan Gita) yang berada di ketinggian Pegunungan Arfak, dikelilingi kabut magis dan pemandangan alam yang sangat asri." },
            { id: 6, provinsi: "papua", lokasi: "Jayapura, Papua", label: "Alam", warnaLabel: "bg-green-500 text-white", judul: "Danau Sentani", gambar: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=800&q=80", deskripsi: "Danau terluas di Papua yang dihiasi 21 pulau kecil. Lokasi diselenggarakannya Festival Danau Sentani yang menampilkan tarian adat di atas perahu tradisional." },
            { id: 7, provinsi: "papua", lokasi: "Jayapura, Papua", label: "Sejarah", warnaLabel: "bg-amber-700 text-white", judul: "Tugu MacArthur", gambar: "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=800&q=80", deskripsi: "Situs saksi bisu sejarah Perang Dunia II, bekas markas Jenderal Douglas MacArthur, yang menawarkan lanskap panorama indah Danau Sentani dari atas bukit Ifar Gunung." },
            { id: 8, provinsi: "papua", lokasi: "Jayapura, Papua", label: "Pantai", warnaLabel: "bg-cyan-500 text-white", judul: "Pantai Base G", gambar: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80", deskripsi: "Pantai berpasir putih bersih dengan ombak Samudra Pasifik. Memiliki nilai historis kuat sebagai basis pasukan Sekutu pada masa lalu dan kini menjadi tempat rekreasi favorit warga." },
            { id: 9, provinsi: "papua-tengah", lokasi: "Nabire, Papua Tengah", label: "Satwa", warnaLabel: "bg-teal-600 text-white", judul: "Taman Nasional Teluk Cenderawasih", gambar: "https://images.unsplash.com/photo-1582967788606-a171c1080cb0?auto=format&fit=crop&w=800&q=80", deskripsi: "Taman nasional perairan laut terluas di Indonesia. Surganya para penyelam untuk mendapatkan pengalaman langka berenang berdampingan dengan Hiu Paus raksasa yang jinak." },
            { id: 10, provinsi: "papua-tengah", lokasi: "Mimika, Papua Tengah", label: "Pegunungan", warnaLabel: "bg-gray-800 text-white", judul: "Puncak Jayawijaya (Carstensz)", gambar: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80", deskripsi: "Salah satu dari 'Seven Summits' dunia. Satu-satunya kawasan di lintang tropis Indonesia di mana Anda bisa menemukan gletser atau salju abadi di puncaknya." },
            { id: 11, provinsi: "papua-tengah", lokasi: "Paniai, Papua Tengah", label: "Alam", warnaLabel: "bg-green-500 text-white", judul: "Danau Paniai", gambar: "https://images.unsplash.com/photo-1437482078695-73f5ca6c96e2?auto=format&fit=crop&w=800&q=80", deskripsi: "Pernah dinobatkan sebagai salah satu danau terindah pada Konferensi Danau Se-Dunia. Menyajikan pesona air kebiruan yang dikelilingi tebing hijau yang sejuk." },
            { id: 12, provinsi: "papua-pegunungan", lokasi: "Wamena, Papua Pegunungan", label: "Budaya", warnaLabel: "bg-red-500 text-white", judul: "Lembah Baliem", gambar: "https://images.unsplash.com/photo-1590523277543-a94d2e4eb00b?auto=format&fit=crop&w=800&q=80", deskripsi: "Rumah bagi suku Dani, Yali, dan Lani. Saksikan tradisi purba yang masih terjaga, mumi yang diawetkan ratusan tahun, dan festival perang adat terbesar di dunia setiap bulan Agustus." },
            { id: 13, provinsi: "papua-pegunungan", lokasi: "Jayawijaya, Papua Pegunungan", label: "Pegunungan", warnaLabel: "bg-gray-800 text-white", judul: "Danau Habema", gambar: "https://images.unsplash.com/photo-1457459676225-c72eb1f364e5?auto=format&fit=crop&w=800&q=80", deskripsi: "Berada di atas awan dengan ketinggian 3.225 mdpl, menjadikannya danau tertinggi di Indonesia dengan latar belakang memukau Puncak Trikora." },
            { id: 14, provinsi: "papua-selatan", lokasi: "Merauke, Papua Selatan", label: "Taman Nasional", warnaLabel: "bg-teal-600 text-white", judul: "Taman Nasional Wasur", gambar: "https://images.unsplash.com/photo-1547234935-80b7145b0d01?auto=format&fit=crop&w=800&q=80", deskripsi: "Dijuluki sebagai 'Serengeti Papua'. Memiliki lanskap padang rumput savana luas tempat berkerumunnya kanguru pohon, wallaby liar, dan berbagai spesies burung eksotis." },
            { id: 15, provinsi: "papua-selatan", lokasi: "Merauke, Papua Selatan", label: "Landmark", warnaLabel: "bg-yellow-400 text-gray-900", judul: "Monumen Kapsul Waktu", gambar: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=800&q=80", deskripsi: "Bangunan ikonik yang arsitekturnya sering disamakan dengan markas Avengers. Monumen ini menyimpan harapan dan impian anak-anak Indonesia yang baru akan dibuka pada tahun 2085." }
        ];

        const gridContainer = document.getElementById('grid-container');
        const searchInput = document.getElementById('searchInput');
        let currentFilter = 'all';

        // Render Kartu & Integrasi Modal
        function renderKartu(data) {
            gridContainer.innerHTML = ''; 
            if(data.length === 0) {
                gridContainer.innerHTML = '<div class="col-span-full py-16 text-center fade-in"><i class="fas fa-search text-5xl text-gray-300 mb-4"></i><p class="text-gray-500 font-bold text-lg">Maaf, destinasi tidak ditemukan.</p></div>';
                return;
            }

            data.forEach(item => {
                const cardHTML = `
                    <div class="bg-white rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden fade-in flex flex-col border border-gray-100 transform hover:-translate-y-1">
                        <div class="h-56 overflow-hidden bg-gray-200 relative group cursor-pointer" onclick="bukaModal(${item.id})">
                            <img src="${item.gambar}" alt="${item.judul}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                            <span class="absolute top-4 right-4 ${item.warnaLabel} text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wider shadow-sm">${item.label}</span>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="mb-2 flex items-center text-xs font-bold text-green-700 bg-green-50 w-max px-3 py-1 rounded-md">
                                <i class="fas fa-map-marker-alt mr-2 text-green-600"></i> ${item.lokasi}
                            </div>
                            <h4 class="font-extrabold text-2xl mb-3 text-gray-900 line-clamp-1">${item.judul}</h4>
                            <p class="text-gray-600 text-sm mb-5 line-clamp-2 leading-relaxed">${item.deskripsi}</p>
                            <button onclick="bukaModal(${item.id})" class="inline-flex items-center text-gray-900 font-bold text-sm hover:text-green-700 transition-colors mt-auto text-left">
                                Baca Panduan <i class="fas fa-arrow-right ml-2 text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                gridContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Logika Filter & Search
        function saringData() {
            const searchTerm = searchInput.value.toLowerCase();
            const dataDisaring = dataDestinasi.filter(item => {
                const matchProvinsi = currentFilter === 'all' || item.provinsi === currentFilter;
                const matchSearch = item.judul.toLowerCase().includes(searchTerm) || item.lokasi.toLowerCase().includes(searchTerm);
                return matchProvinsi && matchSearch;
            });
            renderKartu(dataDisaring);
        }

        // Event Listeners Filter Tombol
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-green-700', 'text-white', 'shadow-md');
                    b.classList.add('bg-white', 'text-gray-700', 'shadow-sm');
                });
                btn.classList.remove('bg-white', 'text-gray-700', 'shadow-sm');
                btn.classList.add('bg-green-700', 'text-white', 'shadow-md');
                
                currentFilter = btn.getAttribute('data-filter');
                saringData();
            });
        });

        // Event Listener Search Input
        searchInput.addEventListener('input', saringData);

        // Inisialisasi awal
        renderKartu(dataDestinasi);

        // LOGIKA MODAL POP-UP
        const modal = document.getElementById('modalDetail');
        function bukaModal(id) {
            const item = dataDestinasi.find(d => d.id === id);
            document.getElementById('modalImg').src = item.gambar;
            document.getElementById('modalLabel').textContent = item.label;
            document.getElementById('modalLabel').className = `text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-wider text-white mb-4 inline-block ${item.warnaLabel}`;
            document.getElementById('modalTitle').textContent = item.judul;
            document.getElementById('modalLokasi').textContent = item.lokasi;
            document.getElementById('modalDesc').textContent = item.deskripsi;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden'; // Kunci scroll background
        }

        function tutupModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto'; // Buka kunci scroll background
        }

        // Tutup modal jika klik area luar modal
        modal.addEventListener('click', function(e) {
            if (e.target === modal) tutupModal();
        });

        // LOGIKA BACK TO TOP BUTTON
        const btnBackTop = document.getElementById('btnBackTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                btnBackTop.classList.remove('scale-0', 'opacity-0');
                btnBackTop.classList.add('scale-100', 'opacity-100');
            } else {
                btnBackTop.classList.remove('scale-100', 'opacity-100');
                btnBackTop.classList.add('scale-0', 'opacity-0');
            }
        });
    </script>
</body>
</html>
